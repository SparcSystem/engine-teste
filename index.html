<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ITsMagic-like 3D Engine – Web Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e1e1e; color: #ddd; overflow: hidden; height: 100vh; display: flex; flex-direction: column; font-size: 13px; }
  
  /* Topbar */
  .topbar { background: #2d2d30; border-bottom: 1px solid #3e3e42; padding: 6px 12px; display: flex; align-items: center; gap: 10px; height: 40px; }
  .topbar .logo { font-weight: bold; color: #4ec9b0; margin-right: 10px; }
  .topbar button { background: #3e3e42; color: #ddd; border: 1px solid #555; padding: 4px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .topbar button:hover { background: #505050; }
  .topbar .tabs { display: flex; gap: 2px; margin-left: 10px; }
  .topbar .tab { padding: 5px 14px; background: #2d2d30; cursor: pointer; border-radius: 3px 3px 0 0; border: 1px solid transparent; }
  .topbar .tab.active { background: #3e3e42; border-color: #555; border-bottom-color: #3e3e42; color: #4ec9b0; }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .topbar .currency { color: #f0c674; font-weight: bold; }
  .topbar .coin { color: #dcdcaa; }
  
  /* Main layout */
  .main { flex: 1; display: flex; overflow: hidden; }
  
  /* Panels */
  .panel { background: #252526; border: 1px solid #3e3e42; display: flex; flex-direction: column; }
  .panel-header { background: #2d2d30; padding: 6px 10px; font-weight: bold; border-bottom: 1px solid #3e3e42; font-size: 12px; color: #4ec9b0; display: flex; justify-content: space-between; align-items: center; }
  .panel-body { flex: 1; overflow-y: auto; padding: 6px; }
  
  /* Hierarchy */
  .hierarchy { width: 220px; }
  .hierarchy-item { padding: 4px 8px; cursor: pointer; border-radius: 2px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .hierarchy-item:hover { background: #2a2d2e; }
  .hierarchy-item.selected { background: #094771; color: #fff; }
  
  /* Viewport */
  .viewport { flex: 1; position: relative; background: #1e1e1e; }
  .viewport canvas { display: block; width: 100%; height: 100%; }
  .viewport-info { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 3px; font-size: 11px; pointer-events: none; }
  
  /* Inspector */
  .inspector { width: 280px; }
  .inspector-section { margin-bottom: 8px; border: 1px solid #3e3e42; border-radius: 3px; }
  .inspector-section-title { background: #2d2d30; padding: 5px 8px; font-size: 11px; color: #4ec9b0; cursor: pointer; }
  .inspector-row { display: flex; align-items: center; padding: 3px 8px; gap: 6px; font-size: 12px; }
  .inspector-row label { width: 70px; color: #aaa; }
  .inspector-row input[type="text"], .inspector-row input[type="number"] { flex: 1; background: #3c3c3c; border: 1px solid #555; color: #ddd; padding: 2px 5px; border-radius: 2px; font-size: 11px; }
  .inspector-row input[type="color"] { width: 30px; height: 20px; border: 1px solid #555; background: #3c3c3c; cursor: pointer; }
  .vec3-inputs { display: flex; gap: 3px; flex: 1; }
  .vec3-inputs input { width: 100%; }
  
  /* Assets */
  .assets { height: 160px; border-top: 1px solid #3e3e42; }
  .assets-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  .asset-item { width: 60px; height: 60px; background: #3c3c3c; border: 1px solid #555; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; text-align: center; padding: 2px; overflow: hidden; }
  .asset-item:hover { border-color: #4ec9b0; }
  .asset-item img { width: 40px; height: 40px; object-fit: cover; margin-bottom: 2px; }
  
  /* Status bar */
  .statusbar { background: #007acc; color: #fff; padding: 3px 10px; font-size: 11px; display: flex; gap: 15px; }
  
  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.show { display: flex; }
  .modal { background: #2d2d30; border: 1px solid #555; border-radius: 5px; min-width: 320px; }
  .modal-header { padding: 10px 14px; border-bottom: 1px solid #3e3e42; font-weight: bold; }
  .modal-body { padding: 14px; }
  .modal-footer { padding: 10px 14px; border-top: 1px solid #3e3e42; display: flex; justify-content: flex-end; gap: 8px; }
  .modal input, .modal textarea { width: 100%; background: #3c3c3c; border: 1px solid #555; color: #ddd; padding: 5px; border-radius: 2px; }
  
  .empty-msg { color: #666; font-style: italic; text-align: center; padding: 20px; font-size: 12px; }
  
  .btn-primary { background: #0e639c; color: #fff; border: none; padding: 5px 14px; cursor: pointer; border-radius: 3px; }
  .btn-primary:hover { background: #1177bb; }
  .btn-secondary { background: #3e3e42; color: #ddd; border: 1px solid #555; padding: 5px 14px; cursor: pointer; border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">⊞ ITsMagic</div>
  <button id="btn-save" title="Salvar">💾</button>
  <button id="btn-new" title="Novo Projeto">📄+</button>
  <button id="btn-store" title="Loja">🛒</button>
  <button id="btn-export" title="Exportar">⬇</button>
  <button id="btn-publish" title="Publicar">📤</button>
  <div class="tabs">
    <div class="tab active" data-tab="editor">3D Editor</div>
    <div class="tab" data-tab="game">Game</div>
    <div class="tab" data-tab="code">Codificação</div>
  </div>
  <div class="right">
    <span style="font-size:11px;">v0.2000 Beta • Three.js</span>
    <span class="currency">💵 0</span>
    <span class="coin">🪙 0</span>
    <button>+</button>
    <button>👤 Log-in</button>
  </div>
</div>

<div class="main">
  <!-- Hierarchy -->
  <div class="panel hierarchy">
    <div class="panel-header">
      Hierarchy
      <div>
        <button id="btn-add" style="padding:2px 6px;font-size:11px;">+</button>
        <button id="btn-delete" style="padding:2px 6px;font-size:11px;">🗑</button>
      </div>
    </div>
    <div class="panel-body" id="hierarchy-list"></div>
  </div>

  <!-- Viewport + Assets -->
  <div style="flex:1; display:flex; flex-direction:column;">
    <div class="viewport" id="viewport">
      <div class="viewport-info">3D Editor • Clique para selecionar • Arraste o gizmo</div>
      <div id="play-indicator" style="position:absolute;top:8px;right:8px;background:#0e639c;color:#fff;padding:3px 10px;border-radius:3px;font-size:11px;display:none;">▶ PLAYING</div>
    </div>
    <div class="panel assets">
      <div class="panel-header">
        📦 Assets
        <button id="btn-import" style="padding:2px 8px;font-size:11px;">▼ Importar</button>
      </div>
      <div class="panel-body">
        <div class="assets-grid" id="assets-grid"></div>
      </div>
    </div>
  </div>

  <!-- Inspector -->
  <div class="panel inspector">
    <div class="panel-header">Inspector</div>
    <div class="panel-body" id="inspector-body">
      <div class="empty-msg">— Selecione um objeto</div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span id="fps-counter">FPS: —</span>
  <span id="obj-counter">Objetos: 0</span>
  <span id="mode-indicator">Modo: Edit</span>
</div>

<!-- Add Object Modal -->
<div class="modal-bg" id="modal-add">
  <div class="modal">
    <div class="modal-header">Adicionar Objeto</div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn-secondary" data-add="cube">🟦 Cubo</button>
      <button class="btn-secondary" data-add="sphere">🔵 Esfera</button>
      <button class="btn-secondary" data-add="cylinder">🛢 Cilindro</button>
      <button class="btn-secondary" data-add="plane">▭ Plano</button>

    <div class="modal-footer"><button class="btn-secondary" onclick="closeModal('modal-add')">Fechar</button></div>

</div>

<!-- Rename Modal -->

  <div class="modal">
    <div class="modal-header">Renomear</div>
    <div class="modal-body"><input type="text" id="rename-input"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-rename')">Cancelar</button>

<!-- Import Modal -->

    <div class="modal-header">Importar Asset</div>

    </div>
    <div class="modal-footer">

      <button class="btn-primary" id="import-confirm">Importar</button>
    </div>
  </div>
</div>

<!-- Load Three.js -->
<script>
  const status = document.querySelector('.viewport-info');
  const loadScript = (src) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  (async () => {
    try {
      status.textContent = 'Carregando Three.js...';
      await loadScript('https://unpkg.com/three@0.160.0/build/three.min.js');
      await loadScript('https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js');
      await loadScript('https://unpkg.com/three@0.160.0/examples/js/controls/TransformControls.js');
      initEngine();
    } catch(e) {
      status.textContent = 'Erro ao carregar Three.js: ' + e.message;
    }
  })();
</script>

<script>
/* =========================================================
   ENGINE CORE
========================================================= */
let scene, camera, renderer, orbitControls, transformControls;
let sceneObjects = []; // {id, name, mesh, type, scripts:[]}
let selectedObject = null;
let assets = []; // {id, name, type, url, data}
let nextId = 1;
let isPlaying = false;

function initEngine() {
  const viewport = document.getElementById('viewport');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2a2a);
  scene.fog = new THREE.Fog(0x2a2a2a, 20, 80);
  
  camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
  camera.position.set(5, 5, 8);
  camera.lookAt(0, 0, 0);
  
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  viewport.appendChild(renderer.domElement);
  
  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 15, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);
  
  // Grid
  const grid = new THREE.GridHelper(20, 20, 0x555555, 0x333333);
  scene.add(grid);
  
  // Controls
  orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
  orbitControls.enableDamping = true;
  
  transformControls = new THREE.TransformControls(camera, renderer.domElement);
  transformControls.addEventListener('dragging-changed', e => {
    orbitControls.enabled = !e.value;
  });
  transformControls.addEventListener('change', () => {
    if (selectedObject) updateInspector();
  });
  scene.add(transformControls);
  
  // Click to select
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (transformControls.dragging) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const meshes = sceneObjects.map(o => o.mesh);
    const hits = raycaster.intersectObjects(meshes, true);
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj && !obj.userData.engineId) obj = obj.parent;
      if (obj) selectObject(obj.userData.engineId);
    } else {
      selectObject(null);
    }
  });
  
  window.addEventListener('resize', () => {
    camera.aspect = viewport.clientWidth / viewport.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  });
  
  animate();
  document.querySelector('.viewport-info').textContent = '3D Editor • Clique para selecionar • Arraste o gizmo';
}

let lastTime = performance.now();
let frames = 0, fpsTime = 0;
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  
  frames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) {
    document.getElementById('fps-counter').textContent = 'FPS: ' + Math.round(frames / fpsTime);
    frames = 0; fpsTime = 0;
  }
  
  if (isPlaying) {
    // Run scripts here
  }
  
  orbitControls.update();
  renderer.render(scene, camera);
}

/* =========================================================
   OBJECT MANAGEMENT
========================================================= */
function createObject(type) {
  let geometry, material, mesh, name, objType;
  const id = nextId++;
  
  switch(type) {
    case 'cube':
      geometry = new THREE.BoxGeometry(1, 1, 1);
      material = new THREE.MeshStandardMaterial({ color: 0x4ec9b0 });
      mesh = new THREE.Mesh(geometry, material);
      name = 'Cubo'; objType = 'mesh';
      break;
    case 'sphere':
      geometry = new THREE.SphereGeometry(0.5, 32, 32);
      material = new THREE.MeshStandardMaterial({ color: 0x569cd6 });
      mesh = new THREE.Mesh(geometry, material);
      name = 'Esfera'; objType = 'mesh';
      break;
    case 'cylinder':
      geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
      material = new THREE.MeshStandardMaterial({ color: 0xce9178 });
      mesh = new THREE.Mesh(geometry, material);
      name = 'Cilindro'; objType = 'mesh';
      break;
    case 'plane':
      geometry = new THREE.PlaneGeometry(5, 5);
      material = new THREE.MeshStandardMaterial({ color: 0x606060, side: THREE.DoubleSide });
      mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.x = -Math.PI / 2;
      name = 'Plano'; objType = 'mesh';
      break;
    case 'light':
      mesh = new THREE.PointLight(0xffffff, 1, 20);
      mesh.add(new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({ color: 0xffff00 })));
      name = 'Luz'; objType = 'light';
      break;
    case 'camera':
      mesh = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
      const helper = new THREE.CameraHelper(mesh);
      mesh.add(helper);
      name = 'Câmera'; objType = 'camera';
      break;
  }
  
  mesh.position.y = type === 'plane' ? 0.01 : 0.5;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.engineId = id;
  scene.add(mesh);
  
  const obj = { id, name: name + '_' + id, mesh, type: objType, scripts: [] };
  sceneObjects.push(obj);
  refreshHierarchy();
  document.getElementById('obj-counter').textContent = 'Objetos: ' + sceneObjects.length;
  selectObject(id);
  return obj;
}

function deleteSelected() {
  if (!selectedObject) return;
  const idx = sceneObjects.findIndex(o => o.id === selectedObject.id);
  if (idx < 0) return;
  scene.remove(selectedObject.mesh);
  transformControls.detach();
  sceneObjects.splice(idx, 1);
  selectedObject = null;
  refreshHierarchy();
  refreshInspector();
  document.getElementById('obj-counter').textContent = 'Objetos: ' + sceneObjects.length;
}

function selectObject(id) {
  if (id === null) {
    selectedObject = null;
    transformControls.detach();
  } else {
    selectedObject = sceneObjects.find(o => o.id === id) || null;
    if (selectedObject && selectedObject.type === 'mesh') {
      transformControls.attach(selectedObject.mesh);
    } else {
      transformControls.detach();
    }
  }
  refreshHierarchy();
  refreshInspector();
}

/* =========================================================
   HIERARCHY
========================================================= */
function refreshHierarchy() {
  const list = document.getElementById('hierarchy-list');
  list.innerHTML = '';
  sceneObjects.forEach(obj => {
    const item = document.createElement('div');
    item.className = 'hierarchy-item' + (selectedObject && selectedObject.id === obj.id ? ' selected' : '');
    const icon = obj.type === 'mesh' ? '🟦' : obj.type === 'light' ? '💡' : '📷';
    item.innerHTML = `<span>${icon}</span><span style="flex:1;">${obj.name}</span>`;
    item.onclick = () => selectObject(obj.id);
    item.ondblclick = () => openRename(obj);
    list.appendChild(item);
  });
}

/* =========================================================
   INSPECTOR
========================================================= */
function refreshInspector() {
  const body = document.getElementById('inspector-body');
  if (!selectedObject) {
    body.innerHTML = '<div class="empty-msg">— Selecione um objeto</div>';
    return;
  }
  updateInspector();
}

function updateInspector() {
  const body = document.getElementById('inspector-body');
  const obj = selectedObject;
  if (!obj) return;
  
  const pos = obj.mesh.position;
  const rot = obj.mesh.rotation;
  const scl = obj.mesh.scale;
  
  let html = `
    <div class="inspector-section">
      <div class="inspector-section-title">🏷 Transform</div>
      <div class="inspector-row"><label>Nome</label><input type="text" id="inp-name" value="${obj.name}"></div>
      <div class="inspector-row"><label>Posição</label>
        <div class="vec3-inputs">
          <input type="number" step="0.1" id="pos-x" value="${pos.x.toFixed(2)}" title="X">
          <input type="number" step="0.1" id="pos-y" value="${pos.y.toFixed(2)}" title="Y">
          <input type="number" step="0.1" id="pos-z" value="${pos.z.toFixed(2)}" title="Z">
        </div>
      </div>
      <div class="inspector-row"><label>Rotação</label>
        <div class="vec3-inputs">
          <input type="number" step="1" id="rot-x" value="${(rot.x*180/Math.PI).toFixed(1)}" title="X°">
          <input type="number" step="1" id="rot-y" value="${(rot.y*180/Math.PI).toFixed(1)}" title="Y°">
          <input type="number" step="1" id="rot-z" value="${(rot.z*180/Math.PI).toFixed(1)}" title="Z°">
        </div>
      </div>
      <div class="inspector-row"><label>Escala</label>
        <div class="vec3-inputs">
          <input type="number" step="0.1" id="scl-x" value="${scl.x.toFixed(2)}" title="X">
          <input type="number" step="0.1" id="scl-y" value="${scl.y.toFixed(2)}" title="Y">
          <input type="number" step="0.1" id="scl-z" value="${scl.z.toFixed(2)}" title="Z">
        </div>
      </div>
    </div>
  `;
  
  if (obj.type === 'mesh' && obj.mesh.material) {
    const mat = obj.mesh.material;
    const colorHex = '#' + mat.color.getHexString();
    html += `
      <div class="inspector-section">
        <div class="inspector-section-title">🎨 Material</div>
        <div class="inspector-row"><label>Cor</label><input type="color" id="mat-color" value="${colorHex}"></div>
        <div class="inspector-row"><label>Metalness</label><input type="number" step="0.05" min="0" max="1" id="mat-metal" value="${mat.metalness || 0}"></div>
        <div class="inspector-row"><label>Roughness</label><input type="number" step="0.05" min="0" max="1" id="mat-rough" value="${mat.roughness !== undefined ? mat.roughness : 0.5}"></div>
        <div class="inspector-row"><label>Textura</label>
          <select id="mat-texture" style="flex:1;background:#3c3c3c;border:1px solid #555;color:#ddd;padding:2px;">
            <option value="">(nenhuma)</option>
          </select>
        </div>
      </div>
    `;
  }
  
  if (obj.type === 'light') {
    const light = obj.mesh;
    html += `
      <div class="inspector-section">
        <div class="inspector-section-title">💡 Luz</div>
        <div class="inspector-row"><label>Cor</label><input type="color" id="light-color" value="#${light.color.getHexString()}"></div>
        <div class="inspector-row"><label>Intensidade</label><input type="number" step="0.1" id="light-int" value="${light.intensity}"></div>
      </div>
    `;
  }
  
  html += `
    <div class="inspector-section">
      <div class="inspector-section-title">📜 Scripts</div>
      <div id="scripts-list" style="padding:6px;">
        ${obj.scripts.length === 0 ? '<div style="color:#666;font-size:11px;">Nenhum script anexado</div>' : ''}
        ${obj.scripts.map((s,i) => `<div style="padding:3px 6px;background:#3c3c3c;margin-bottom:3px;border-radius:2px;font-size:11px;display:flex;justify-content:space-between;"><span>📜 ${s.name}</span><button onclick="removeScript(${i})" style="background:none;border:none;color:#f44;cursor:pointer;">✕</button></div>`).join('')}
      </div>
      <div style="padding:6px;">
        <select id="script-select" style="width:100%;background:#3c3c3c;border:1px solid #555;color:#ddd;padding:3px;font-size:11px;">
          <option value="">-- Anexar script --</option>
          ${assets.filter(a => a.type === 'script').map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
        </select>
      </div>
    </div>
  `;
  
  body.innerHTML = html;
  
  // Bind events
  bindInspectorEvents();
  populateTextureSelect();
}

function bindInspectorEvents() {
  const obj = selectedObject;
  if (!obj) return;
  
  const on = (id, evt, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(evt, fn); };
  
  on('inp-name', 'change', e => { obj.name = e.target.value; refreshHierarchy(); });
  on('pos-x', 'input', e => { obj.mesh.position.x = parseFloat(e.target.value) || 0; });
  on('pos-y', 'input', e => { obj.mesh.position.y = parseFloat(e.target.value) || 0; });
  on('pos-z', 'input', e => { obj.mesh.position.z = parseFloat(e.target.value) || 0; });
  on('rot-x', 'input', e => { obj.mesh.rotation.x = (parseFloat(e.target.value) || 0) * Math.PI / 180; });
  on('rot-y', 'input', e => { obj.mesh.rotation.y = (parseFloat(e.target.value) || 0) * Math.PI / 180; });
  on('rot-z', 'input', e => { obj.mesh.rotation.z = (parseFloat(e.target.value) || 0) * Math.PI / 180; });
  on('scl-x', 'input', e => { obj.mesh.scale.x = parseFloat(e.target.value) || 1; });
  on('scl-y', 'input', e => { obj.mesh.scale.y = parseFloat(e.target.value) || 1; });
  on('scl-z', 'input', e => { obj.mesh.scale.z = parseFloat(e.target.value) || 1; });
  
  if (obj.type === 'mesh' && obj.mesh.material) {
    const mat = obj.mesh.material;
    on('mat-color', 'input', e => { mat.color.set(e.target.value); });
    on('mat-metal', 'input', e => { mat.metalness = parseFloat(e.target.value) || 0; });
    on('mat-rough', 'input', e => { mat.roughness = parseFloat(e.target.value) || 0.5; });
    on('mat-texture', 'change', e => {
      const assetId = e.target.value;
      if (!assetId) {
        // Remover textura
        mat.map = null;
        mat.needsUpdate = true;
        return;
      }
      const asset = assets.find(a => a.id == assetId);
      if (asset && asset.type === 'image') {
        // CRIAR/REUTILIZAR A TEXTURA E APLICAR AO MATERIAL
        const loader = new THREE.TextureLoader();
        loader.load(asset.url, (texture) => {
          // Configurações importantes para a textura aparecer corretamente
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.flipY = true;
          
          mat.map = texture;
          mat.needsUpdate = true; // Força o material a recompilar o shader
        }, undefined, (err) => {
          console.error('Erro ao carregar textura:', err);
          alert('Erro ao carregar a textura: ' + (err.message || 'arquivo inválido'));
        });
      }
    });
  }
  
  if (obj.type === 'light') {
    on('light-color', 'input', e => { obj.mesh.color.set(e.target.value); });
    on('light-int', 'input', e => { obj.mesh.intensity = parseFloat(e.target.value) || 1; });
  }
  
  on('script-select', 'change', e => {
    const assetId = parseInt(e.target.value);
    if (!assetId) return;
    const asset = assets.find(a => a.id === assetId);
    if (asset) {
      obj.scripts.push({ name: asset.name, assetId: asset.id, code: asset.code || '' });
      updateInspector();
    }
  });
}

function populateTextureSelect() {
  const sel = document.getElementById('mat-texture');
  if (!sel) return;
  const imageAssets = assets.filter(a => a.type === 'image');
  // Limpa opções existentes exceto a primeira "(nenhuma)"
  while (sel.options.length > 1) sel.remove(1);
  imageAssets.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.id;
    opt.textContent = a.name;
    sel.appendChild(opt);
  });
  // Seleciona a textura atual do material, se houver
  if (selectedObject && selectedObject.mesh && selectedObject.mesh.material) {
    const currentMap = selectedObject.mesh.material.map;
    if (currentMap && currentMap.userData && currentMap.userData.assetId) {
      sel.value = currentMap.userData.assetId;
    }
  }
}

function removeScript(index) {
  if (!selectedObject) return;
  selectedObject.scripts.splice(index, 1);
  updateInspector();
}

/* =========================================================
   ASSETS
========================================================= */
function refreshAssets() {
  const grid = document.getElementById('assets-grid');
  grid.innerHTML = '';
  if (assets.length === 0) {
    grid.innerHTML = '<div class="empty-msg" style="width:100%;">Nenhum asset importado</div>';
    return;
  }
  assets.forEach(a => {
    const item = document.createElement('div');
    item.className = 'asset-item';
    item.title = a.name;
    if (a.type === 'image') {
      item.innerHTML = `<img src="${a.url}"><span>${a.name}</span>`;
    } else if (a.type === 'script') {
      item.innerHTML = `<div style="font-size:24px;">📜</div><span>${a.name}</span>`;
    } else if (a.type === 'audio') {
      item.innerHTML = `<div style="font-size:24px;">🔊</div><span>${a.name}</span>`;
    } else if (a.type === 'model') {
      item.innerHTML = `<div style="font-size:24px;">📦</div><span>${a.name}</span>`;
    }
    item.onclick = () => {
      // Se for imagem e tiver objeto selecionado, aplica como textura
      if (a.type === 'image' && selectedObject && selectedObject.type === 'mesh') {
        const loader = new THREE.TextureLoader();
        loader.load(a.url, (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.flipY = true;
          selectedObject.mesh.material.map = texture;
          selectedObject.mesh.material.needsUpdate = true;
        }, undefined, (err) => {
          console.error('Erro ao carregar textura:', err);
          alert('Erro ao carregar a textura.');
        });
      }
    };
    grid.appendChild(item);
  });
}

function importAsset(file) {
  const reader = new FileReader();
  const url = URL.createObjectURL(file);
  const ext = file.name.split('.').pop().toLowerCase();
  let type = 'unknown';
  if (['png','jpg','jpeg','gif','webp','bmp'].includes(ext)) type = 'image';
  else if (['js','java','ts'].includes(ext)) type = 'script';
  else if (['mp3','wav','ogg'].includes(ext)) type = 'audio';
  else if (['gltf','glb'].includes(ext)) type = 'model';
  
  const asset = { id: nextId++, name: file.name, type, url };
  
  if (type === 'script') {
    reader.onload = e => {
      asset.code = e.target.result;
      assets.push(asset);
      refreshAssets();
    };
    reader.readAsText(file);
  } else {
    assets.push(asset);
    refreshAssets();
  }
}

/* =========================================================
   MODALS & UI EVENTS
========================================================= */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
window.closeModal = closeModal;
window.removeScript = removeScript;

document.getElementById('btn-add').onclick = () => openModal('modal-add');
document.getElementById('btn-delete').onclick = deleteSelected;
document.querySelectorAll('[data-add]').forEach(btn => {
  btn.onclick = () => { createObject(btn.dataset.add); closeModal('modal-add'); };
});

let renameTarget = null;
function openRename(obj) {
  renameTarget = obj;
  document.getElementById('rename-input').value = obj.name;
  openModal('modal-rename');
  setTimeout(() => document.getElementById('rename-input').focus(), 50);
}
document.getElementById('rename-confirm').onclick = () => {
  if (renameTarget) {
    renameTarget.name = document.getElementById('rename-input').value || renameTarget.name;
    refreshHierarchy();
    if (selectedObject && selectedObject.id === renameTarget.id) updateInspector();
  }
  closeModal('modal-rename');
};

document.getElementById('btn-import').onclick = () => openModal('modal-import');
document.getElementById('import-confirm').onclick = () => {
  const fileInput = document.getElementById('import-file');
  if (fileInput.files.length > 0) {
    importAsset(fileInput.files[0]);
    fileInput.value = '';
    closeModal('modal-import');
  }
};

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const mode = document.getElementById('mode-indicator');
    if (tab.dataset.tab === 'game') {
      isPlaying = true;
      document.getElementById('play-indicator').style.display = 'block';
      mode.textContent = 'Modo: Play';
    } else {
      isPlaying = false;
      document.getElementById('play-indicator').style.display = 'none';
      mode.textContent = 'Modo: Edit';
    }
  };
});

// Transform mode shortcuts
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'w' || e.key === 'W') transformControls.setMode('translate');
  if (e.key === 'e' || e.key === 'E') transformControls.setMode('rotate');
  if (e.key === 'r' || e.key === 'R') transformControls.setMode('scale');
  if (e.key === 'Delete') deleteSelected();
});

// Create a default cube
setTimeout(() => createObject('cube'), 100);
</script>
